# config/services.yaml

parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads/resources'

services:
    # Default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $groqApiKey: '%env(string:GROQ_API_KEY)%'
            string $hfApiToken: '%env(string:HF_API_TOKEN)%'

    # Makes classes in src/ available to be used as services
    # This creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Explicit service configuration
    App\EventListener\LoginCaptchaListener:
        arguments:
            $recaptchaSecret: '%env(RECAPTCHA_SECRET_KEY)%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 10 }

    App\Service\GoogleAnalyticsResourceMetricsService:
        arguments:
            $ga4PropertyId: '%env(string:GA4_PROPERTY_ID)%'
            $ga4CredentialsPath: '%env(string:GA4_CREDENTIALS_PATH)%'
            $ga4LookbackDays: '%env(int:GA4_LOOKBACK_DAYS)%'
            $projectDir: '%kernel.project_dir%'
